<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.4 Inter, system-ui, sans-serif;
    color: var(--figma-color-text, #1e1e1e);
    background: var(--figma-color-bg, #fff);
  }
  .bar {
    flex: none; display: flex; align-items: center; gap: 4px;
    height: 40px; padding: 0 8px;
    border-bottom: 1px solid var(--figma-color-border, #e6e6e6);
  }
  .title { font-weight: 600; margin-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .grow { flex: 1; min-width: 8px; }
  button {
    display: grid; place-items: center; height: 28px; min-width: 28px; padding: 0 6px;
    border: 0; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  button:hover { background: var(--figma-color-bg-hover, #f0f0f0); }
  button.active { background: var(--figma-color-bg-selected, #e5f4ff); color: var(--figma-color-text-brand, #0d99ff); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--figma-color-border-selected, #0d99ff); outline-offset: 1px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .size { min-width: 112px; text-align: center; font-variant-numeric: tabular-nums; color: var(--figma-color-text-secondary, #777); }
  .stage { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; background: var(--figma-color-bg-secondary, #f5f5f5); }
  .box { position: relative; background: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .18); }
  .box iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .note { max-width: 420px; padding: 24px; text-align: center; color: var(--figma-color-text-secondary, #777); }
  .note b { display: block; margin-bottom: 6px; color: var(--figma-color-text, #1e1e1e); font-size: 13px; }
  .note code { font-size: 11px; word-break: break-all; }
  .settings { flex: none; display: none; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid var(--figma-color-border, #e6e6e6); }
  .settings.open { display: flex; }
  .settings label { white-space: nowrap; }
  .settings input {
    flex: 1; height: 28px; padding: 0 8px; font: inherit; color: inherit;
    background: var(--figma-color-bg, #fff); border: 1px solid var(--figma-color-border, #e6e6e6); border-radius: 6px;
  }
  .settings .hint { color: var(--figma-color-text-secondary, #777); }
  .grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none; }
  .grip::after { content: ""; position: absolute; right: 3px; bottom: 3px; width: 8px; height: 8px; border-right: 2px solid var(--figma-color-border-strong, #999); border-bottom: 2px solid var(--figma-color-border-strong, #999); }
  body.dragging iframe { pointer-events: none; }
</style>
</head>
<body>
<div class="bar">
  <span class="title" id="title">Design Gallery</span>
  <button type="button" data-preset="fill" title="Fill the panel" aria-label="Fill the panel"><svg viewBox="0 0 24 24"><path d="M16 4h4v4"/><path d="M14 10l6-6"/><path d="M8 20H4v-4"/><path d="M4 20l6-6"/><path d="M16 20h4v-4"/><path d="M14 14l6 6"/><path d="M8 4H4v4"/><path d="M4 4l6 6"/></svg></button>
  <button type="button" data-preset="laptop" title="Laptop · 1440 × 900" aria-label="Laptop, 1440 by 900"><svg viewBox="0 0 24 24"><path d="M3 19h18"/><path d="M5 7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/></svg></button>
  <button type="button" data-preset="tablet" title="Tablet · 834 × 1112" aria-label="Tablet, 834 by 1112"><svg viewBox="0 0 24 24"><path d="M5 4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/><path d="M11 17a1 1 0 1 0 2 0a1 1 0 0 0-2 0"/></svg></button>
  <button type="button" data-preset="mobile" title="Phone · 360 × 800" aria-label="Phone, 360 by 800"><svg viewBox="0 0 24 24"><path d="M6 5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M11 4h2"/><path d="M12 17v.01"/></svg></button>
  <span class="size" id="size"></span>
  <span class="grow"></span>
  <button type="button" id="edit" title="Edit with impeccable live, in the browser" aria-label="Edit in the browser" hidden><svg viewBox="0 0 24 24"><path d="M4 20h4L18.5 9.5a2.828 2.828 0 1 0-4-4L4 16v4"/><path d="M13.5 6.5l4 4"/></svg></button>
  <button type="button" id="open" title="Open in the browser" aria-label="Open in the browser" disabled><svg viewBox="0 0 24 24"><path d="M12 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/><path d="M11 13l9-9"/><path d="M15 4h5v5"/></svg></button>
  <button type="button" id="reload" title="Reload" aria-label="Reload" disabled><svg viewBox="0 0 24 24"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg></button>
  <button type="button" id="gear" title="Gallery address" aria-label="Gallery address" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37c1 .608 2.296.07 2.572-1.065"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0-6 0"/></svg></button>
</div>
<div class="settings" id="settings">
  <label for="address">Gallery address</label>
  <input id="address" type="url" placeholder="Leave empty to use the address in each variant's link" spellcheck="false">
  <button type="button" id="save">Save</button>
</div>
<div class="stage" id="stage">
  <div class="note" id="note"><b>Select a variant</b>Select a variant placed from the gallery: its label, one of its screens, or its column. The label links to the variant's live preview, and that link is how this panel finds it.</div>
  <div class="box" id="box" hidden><iframe id="frame" title="Variant preview"></iframe></div>
  <div class="grip" id="grip" title="Resize the panel"></div>
</div>
<script>
const send = (message) => parent.postMessage({ pluginMessage: message }, '*')
const $ = (id) => document.getElementById(id)
const stage = $('stage'), box = $('box'), frame = $('frame'), note = $('note')

const PRESETS = { laptop: [1440, 900], tablet: [834, 1112], mobile: [360, 800] }
let preset = 'fill'
let address = ''          // the user's setting; empty means "use the link's own"
let current = null        // { base, folder, letter, title, preview, page, edit }
const lists = new Map()   // gallery address -> its directions

// The page at its real size, scaled down when the panel is smaller.
function render() {
  if (box.hidden) return
  const pad = preset === 'fill' ? 0 : 16
  const availW = stage.clientWidth - pad * 2, availH = stage.clientHeight - pad * 2
  const [w, h] = PRESETS[preset] || [availW, availH]
  const s = Math.min(1, availW / w, availH / h)
  box.style.width = w * s + 'px'
  box.style.height = h * s + 'px'
  frame.style.width = w + 'px'
  frame.style.height = h + 'px'
  frame.style.transform = 'scale(' + s + ')'
  $('size').textContent = Math.round(w) + ' × ' + Math.round(h) + (s < 1 ? ' · ' + Math.round(s * 100) + '%' : '')
  document.querySelectorAll('[data-preset]').forEach((b) => b.classList.toggle('active', b.dataset.preset === preset))
}

function say(title, html) {
  box.hidden = true
  note.hidden = false
  note.innerHTML = '<b></b>' + html
  note.querySelector('b').textContent = title
  $('size').textContent = ''
}

async function directions(base) {
  if (!lists.has(base)) {
    const response = await fetch(base + '/api/directions.json')
    if (!response.ok) throw new Error('The gallery answered ' + response.status)
    lists.set(base, (await response.json()).directions)
  }
  return lists.get(base)
}

async function show(variant) {
  const base = (address || variant.origin).replace(/\/+$/, '')
  try {
    const direction = (await directions(base)).find((d) => d.folder === variant.folder)
    const found = direction && direction.variants.find((v) => v.letter.toLowerCase() === variant.letter)
    if (!found) return say('Not in the gallery', 'The gallery at <code>' + base + '</code> has no variant “' + variant.letter.toUpperCase() + '” in “' + variant.folder + '”.')
    current = { base, folder: variant.folder, letter: variant.letter, title: found.letter + ' ' + found.title, preview: found.preview, page: found.page, edit: found.edit }
    $('title').textContent = variant.folder + ' · ' + current.title
    frame.src = base + found.preview
    note.hidden = true
    box.hidden = false
    $('open').disabled = $('reload').disabled = false
    $('edit').hidden = !found.edit
    render()
  } catch (error) {
    lists.delete(base)
    say('The gallery is not reachable', 'Tried <code>' + base + '</code>. Start it from the project (<code>node …/gallery.mjs</code>), or set its address with the gear. ' + (error && error.message ? '(' + error.message + ')' : ''))
  }
}

onmessage = (event) => {
  const message = event.data && event.data.pluginMessage
  if (!message) return
  if (message.type === 'settings') { address = message.address; $('address').value = address }
  if (message.type === 'selection') {
    // Selecting something that is not a variant keeps the last one on screen.
    if (message.variant && !(current && current.folder === message.variant.folder && current.letter === message.variant.letter && current.base === (address || message.variant.origin).replace(/\/+$/, ''))) show(message.variant)
  }
}

document.addEventListener('click', (event) => {
  const button = event.target.closest('button')
  if (!button) return
  if (button.dataset.preset) { preset = button.dataset.preset; render() }
  if (button.id === 'open' && current) send({ type: 'open', url: current.base + current.page })
  if (button.id === 'edit' && current && current.edit) send({ type: 'open', url: current.base + current.edit })
  if (button.id === 'reload' && current) { lists.delete(current.base); frame.src = frame.src }
  if (button.id === 'gear') { const open = $('settings').classList.toggle('open'); button.setAttribute('aria-expanded', open); render() }
  if (button.id === 'save') {
    address = $('address').value.trim().replace(/\/+$/, '')
    send({ type: 'address', value: address })
    const again = current
    current = null
    if (again) show({ origin: again.base, folder: again.folder, letter: again.letter })
  }
})

// The grip resizes the plugin's window; the page inside rescales to fit.
$('grip').addEventListener('pointerdown', (down) => {
  down.preventDefault()
  $('grip').setPointerCapture(down.pointerId)
  const from = [innerWidth, innerHeight]
  document.body.classList.add('dragging')
  const move = (e) => send({ type: 'resize', width: Math.min(2400, Math.max(420, from[0] + e.clientX - down.clientX)), height: Math.min(1600, Math.max(360, from[1] + e.clientY - down.clientY)) })
  const up = () => { document.body.classList.remove('dragging'); $('grip').removeEventListener('pointermove', move); $('grip').removeEventListener('pointerup', up) }
  $('grip').addEventListener('pointermove', move)
  $('grip').addEventListener('pointerup', up)
})
addEventListener('resize', render)
send({ type: 'ready' })
</script>
</body>
</html>
