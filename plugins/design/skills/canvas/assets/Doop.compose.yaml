# Doop design canvas, served privately through the Studio Moser preview router
# (preview:serve-preview). One server for every project; projects are canvases.
#
# Before `up`: run `Preview.sh prepare doop` to create the isolated network, and
# put these in a .env beside this file (mode 0600, never committed):
#   DOOP_SOURCE=/path/to/a/clone/of/github.com/kgoedecke/doop
#   DOOP_AUTH_SECRET=$(openssl rand -hex 32)
#   DOOP_PUBLIC_URL=https://preview-doop.<tailnet>.ts.net
#   DOOP_SIGNUP_DOMAINS=example.com
# Then: docker compose --project-name agent-preview-doop -f Doop.compose.yaml up -d --build
services:
  app:
    build: ${DOOP_SOURCE:?set DOOP_SOURCE to a clone of kgoedecke/doop}
    image: doop:local
    container_name: agent-preview-doop
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://doop:doop@db:5432/doop
      BETTER_AUTH_SECRET: ${DOOP_AUTH_SECRET:?set DOOP_AUTH_SECRET}
      BETTER_AUTH_URL: ${DOOP_PUBLIC_URL:?set DOOP_PUBLIC_URL}
      SIGNUP_EMAIL_DOMAINS: ${DOOP_SIGNUP_DOMAINS:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - agent-preview-doop
    labels:
      dev.studiomoser.agent-preview: "true"
      dev.studiomoser.agent-preview.kind: "app"
      dev.studiomoser.agent-preview.project: "Doop design canvas"
      docktail.service.enable: "true"
      docktail.service.name: "preview-doop"
      docktail.service.description: "Managed by Studio Moser agent preview workflow; project=Doop%20design%20canvas; kind=app"
      docktail.service.port: "4400"
      docktail.service.service-port: "443"
      docktail.service.network: "agent-preview-doop"
      docktail.tags: "tag:agent-preview"
  db:
    image: postgres:16-alpine
    container_name: agent-preview-doop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: doop
      POSTGRES_PASSWORD: doop
      POSTGRES_DB: doop
    volumes:
      - doop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U doop']
      interval: 5s
      timeout: 3s
      retries: 10
networks:
  agent-preview-doop:
    external: true
    name: agent-preview-doop
volumes:
  doop-pg:
