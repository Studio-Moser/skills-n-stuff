<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acme: Twelve years, forty launches</title>
<style>
:root { --paper: #f4efe4; --ink: #1d2327; --rule: #c9bfa8; --accent: #b5462f; --font-figure: system-ui, sans-serif; --font-text: Georgia, serif; --baseline: 28px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/var(--baseline) var(--font-text); }
main { max-width: 68rem; margin: 0 auto; padding: 4rem 2rem; }
.entry { display: grid; grid-template-columns: 14rem 1fr; gap: 2rem; padding-block: 2rem; border-top: 1px solid var(--rule); }
.figure { font: 600 6rem/1 var(--font-figure); color: var(--accent); }
h1 { font: 600 2.5rem/1.15 var(--font-figure); margin: 0 0 .5rem; }
.source { font-size: .875rem; }
@media (max-width: 640px) { .entry { grid-template-columns: 1fr; } .figure { font-size: 4rem; } }
</style>
</head>
<body>
<main>
<section class="entry">
<div class="figure">40</div>
<div>
<h1>Twelve years, forty launches</h1>
<p>Every launch is an entry in the record, with its year and its source.</p>
<p class="source">Source: the project's facts file.</p>
<p><a href="#record">See the record</a></p>
</div>
</section>
</main>
</body>
</html>
