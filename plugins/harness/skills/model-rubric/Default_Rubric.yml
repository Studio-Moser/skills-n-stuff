# Studio Moser seed rubric — the starting point /harness:model-rubric copies before
# the interview. What's here is distributable: intelligence and taste scores are
# house judgment; benchmark blocks are public DeepSWE workload evidence. What's NOT
# here is per-developer: trust, efficiency, capabilities, and routing — the
# interview fills those in. The null/empty placeholders are invalid on purpose so
# an unpersonalized copy fails loudly instead of silently mis-routing.
seed: true                  # remove this key when personalized
reviewed: null              # interview sets today's date; refresh after 14 days
sources: [seed-2026-08-24]  # interview appends current evidence sources / judgment
capabilities: {}            # interview: one entry per provider/CLI, each verified with command -v
models:
