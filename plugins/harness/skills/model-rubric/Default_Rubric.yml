# Studio Moser seed rubric — the starting point /harness:model-rubric copies before
# the interview. Every score here is the house default: intelligence, taste, trust,
# and efficiency are Studio Moser's own judgment, and benchmark blocks are public
# DeepSWE workload evidence. A developer with no opinion yet can keep them; the
# interview overrides any of them. Capabilities, routing, fallbacks, and delegation
# limits stay per-developer: their null/empty placeholders are invalid on purpose so
# an unpersonalized copy fails loudly instead of silently mis-routing.
seed: true                  # remove this key when personalized
reviewed: null              # interview sets today's date; refresh after 14 days
sources: [seed-2026-10-09]  # interview appends current evidence sources / judgment
capabilities: {}            # interview: one entry per provider/CLI, each verified with command -v
models:
