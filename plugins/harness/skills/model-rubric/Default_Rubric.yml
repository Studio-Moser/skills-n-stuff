  # because effort moves agentic quality more than model tier does. At creation,
  # DROP rows whose provider is absent from this developer's capabilities.
  # Provisional: judgment scores are house assumption, not measured. Harness Testing ran
  # Astra at medium as a kickoff model (every harness 24/25 correct on that campaign).
