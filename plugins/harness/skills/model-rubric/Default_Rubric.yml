routing: {}
# routing is DERIVED from this developer's capabilities, trust, and efficiency at
# interview time. Values are <model>@<effort>. The house routing below is what these
# scores derive to for each capability scenario; offer the block that matches the
# developer's capabilities as the default when they have no preference and every named
# row is reachable.
#
# Cross-provider — Claude and Codex:
#
#   routing:
#     orchestrator: claude-opus-5-5@high # preferred top-level context, judgment, synthesis, and delegation
#     default: gpt-6.1-sol@medium        # everyday delegated software work
#     bulk: gpt-6.1-sol@low              # clear-spec mechanical work at lower cost per task
#     quick: gpt-6.1-sol@low             # short latency-sensitive delegated work
#     explore: gpt-6.1-sol@high          # read-only investigation that returns directly to the orchestrator
#     batch: gpt-6-luna@max              # unattended fan-out only
#     taste_min: 9
#     taste: claude-opus-5-5@high
#     review: claude-opus-5-5@high       # strong review of a fixed target
#     independent: gpt-6.1-sol@high      # cross-provider adversarial review of work the Opus orchestrator's provider authored
#   fallbacks:
#     orchestrator: [gpt-6-astra@high]
#     default: [claude-opus-5-5@medium]
#     bulk: [claude-opus-5-5@low]
#     quick: [claude-opus-5-5@low]
#     explore: [claude-haiku-5-5@xhigh]
#     batch: [claude-opus-5-5@medium]
#     taste: [gpt-6-astra@high]
#     review: [gpt-6.1-sol@high]
#     independent: []
#
# Same provider — Claude only. No bulk or batch: no Claude row implements clear-spec work
# for less than default, and Haiku is trusted for exploration only. No independent and no
# fallback chains.
#
#   routing:
#     orchestrator: claude-opus-5-5@high
#     default: claude-opus-5-5@medium
#     quick: claude-opus-5-5@low
#     explore: claude-haiku-5-5@xhigh
#     taste_min: 9
#     taste: claude-opus-5-5@high
#     review: claude-opus-5-5@high
#   fallbacks: {}
#
# Same provider — Codex only. No independent and no fallback chains.
#
#   routing:
#     orchestrator: gpt-6-astra@high
#     default: gpt-6.1-sol@medium
#     bulk: gpt-6.1-sol@low
#     quick: gpt-6.1-sol@low
#     explore: gpt-6.1-sol@high
#     batch: gpt-6-luna@max
#     taste_min: 9
#     taste: gpt-6-astra@high
#     review: gpt-6.1-sol@high
#   fallbacks: {}
fallbacks: {}               # Setup derives values only after the developer interview
delegation:
  max_children: null        # interview: recommend 1 unless measured parallel work needs more
  max_depth: null           # interview: recommend 1 to prevent recursive delegation
  default_token_budget: null # interview: bounded tokens for one delegated track
# Coding-benchmark efficiency never overrides user-owned orchestration trust or taste.
# House anti-patterns (effort-curve facts, safe to distribute):
#   - luna below max is worthless for agentic work; at max it's unattended-batch-only
#     (~158s TTFT).
#   - Effort beats tier: raise a model's effort before reaching for a bigger model.
#   - Max effort is the worst-value rung on most models: claude-sonnet-5-5@max costs $5.46
#     per task against $0.88 at high. Route max only where a row is batch-only.
#   - claude-sonnet-5-5 is off the cross-provider cost line at every rung below max, so it
#     has no row: Haiku 5.5 and Opus 5.5 cover the Claude range.
#   - Haiku 5.5's xhigh rung averages 89k tokens per task, and its launch pricing is
#     reported to rise 5x past 100k context tokens (not verified against Anthropic's price
#     list). Keep its tracks short on metered billing.
