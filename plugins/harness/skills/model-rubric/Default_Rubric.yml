    intelligence: 9
    taste: 9
    trust: trusted
    efficiency: 7
  # Provisional: GPT-6 Luna shipped 2026-09-22 and carries gpt-5.6-luna@max's judgment
  # scores until measured; no DeepSWE run yet. Slopalytics 2026-10-08: max 38.1 / $0.07 /
