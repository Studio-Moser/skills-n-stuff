# Studio Moser seed rubric — the starting point /harness:model-rubric copies before
# the interview. Every score here is the house default: intelligence, taste, trust,
# and efficiency are Studio Moser's own judgment, and benchmark blocks are public
# DeepSWE workload evidence. A developer with no opinion yet can keep them; the
# interview overrides any of them. Capabilities, routing, fallbacks, and delegation
# limits stay per-developer: their null/empty placeholders are invalid on purpose so
# an unpersonalized copy fails loudly instead of silently mis-routing.
seed: true                  # remove this key when personalized
reviewed: null              # interview sets today's date; refresh after 14 days
sources: [seed-2026-10-09, slopalytics-2026-10-08]  # interview appends current evidence sources / judgment
capabilities: {}            # interview: one entry per provider/CLI, each verified with command -v
models:
  # Rows are keyed by (name, effort) — the same model at two efforts is two rows,
  # because effort moves agentic quality more than model tier does. At creation,
  # DROP rows whose provider is absent from this developer's capabilities.
  # Provisional: judgment scores are house assumption, not measured. Harness Testing ran
  # Astra at medium as a kickoff model (every harness 24/25 correct on that campaign).
  - name: gpt-6-astra
    effort: high
    provider: openai
    via: codex
    intelligence: 10
    taste: 9
    trust: preferred
    efficiency: 5
  # Provisional: GPT-6.1 Sol shipped 2026-09-29. Scores are house assumption, not measured;
  # no DeepSWE run yet. Slopalytics 2026-10-08 (Artificial Analysis index / cost per task /
  # time per task): low 42.1 / $0.13 / 80s, medium 47.8 / $0.21 / 158s, high 50.2 / $0.32 /
  # 258s. Every rung is on the cross-provider cost line; low replaces gpt-5.6-terra@high
  # (34.2 / $0.34 / 124s) and gpt-5.6-sol@low (33.5 / $0.26 / 58s) for bulk and quick.
