    effort: low
    provider: openai
    via: codex
    intelligence: 8
    taste: 8
    trust: trusted
    efficiency: 9
  - name: gpt-6.1-sol
    effort: medium
    provider: openai
    via: codex
    intelligence: 9
    taste: 8
    trust: trusted
    efficiency: 8
  - name: gpt-6.1-sol
