name: agent-preview-router

services:
  tailscale:
    image: tailscale/tailscale:v1.102.4@sha256:2667499ed87ae29218f292556ba062918402dd5e92e93637af14867e4df12dd3
    container_name: agent-preview-tailscale
    hostname: ${PREVIEW_ROUTER_HOSTNAME:?Set by Preview.sh}
    environment:
      TS_AUTH_ONCE: "true"
      TS_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID:-}
      TS_CLIENT_SECRET: file:/run/secrets/docktail/tailscale_oauth_client_secret
      TS_EXTRA_ARGS: --advertise-tags=tag:server
      TS_HOSTNAME: ${PREVIEW_ROUTER_HOSTNAME:?Set by Preview.sh}
      TS_OUTBOUND_HTTP_PROXY_LISTEN: :1055
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-socket:/var/run/tailscale
      - ${PREVIEW_CONFIG_DIR:?Set by Preview.sh}/secrets:/run/secrets/docktail:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    networks:
      - preview-edge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "--socket=/var/run/tailscale/tailscaled.sock", "status", "--json"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  docktail:
    image: ghcr.io/marvinvr/docktail:1.6.0@sha256:f3153fb80482755cfed0503b43236d8ae0a2351fd3a267231adcd34ea56c1c1b
    container_name: agent-preview-docktail
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      DEFAULT_SERVICE_TAGS: tag:agent-preview
      DELETE_UNUSED_SERVICES: "false"
      FILE__TAILSCALE_OAUTH_CLIENT_ID: /run/secrets/docktail/tailscale_oauth_client_id
      FILE__TAILSCALE_OAUTH_CLIENT_SECRET: /run/secrets/docktail/tailscale_oauth_client_secret
      LOG_LEVEL: info
      RECONCILE_INTERVAL: 30s
      SKIP_SHUTDOWN_CLEANUP: "false"
      TAILSCALE_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - tailscale-socket:/var/run/tailscale
      - ${PREVIEW_CONFIG_DIR:?Set by Preview.sh}/secrets:/run/secrets/docktail:ro
    networks:
      - preview-edge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "tailscale --socket=/var/run/tailscale/tailscaled.sock serve status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  preview-edge:
    external: true
    name: agent-preview-control

volumes:
  tailscale-state:
  tailscale-socket:
