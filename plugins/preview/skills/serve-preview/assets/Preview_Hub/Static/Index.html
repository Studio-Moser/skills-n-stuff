<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Preview switchboard</title>
    <link rel="stylesheet" href="/App.css">
    <script src="/App.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <p class="identity">Studio Moser</p>
          <h1>Preview switchboard</h1>
          <p class="intro">Open the work currently running across your tailnet.</p>
        </div>
        <div class="sync" aria-live="polite">
          <span class="sync-light" aria-hidden="true"></span>
          <span id="sync-label">Connecting…</span>
        </div>
      </header>

      <section class="controls" aria-label="Preview filters">
        <label class="search">
          <span>Find a project</span>
          <input id="search" type="search" autocomplete="off" placeholder="Search previews or machines">
        </label>
        <div class="filters" role="group" aria-label="Availability">
          <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="live" aria-pressed="false">Live</button>
          <button class="filter" type="button" data-filter="saved" aria-pressed="false">Not live</button>
        </div>
      </section>

      <section class="summary" aria-label="Inventory summary">
        <p><strong id="live-count">—</strong> live</p>
        <p><strong id="service-count">—</strong> previews</p>
        <p><strong id="machine-count">—</strong> machines</p>
      </section>

      <div id="message" class="message" role="status">Loading preview inventory…</div>
      <div id="machines" class="machines" aria-live="polite"></div>
    </main>
  </body>
</html>
